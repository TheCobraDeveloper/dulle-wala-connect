name: Dulle Wala Connect - Pages and APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pages-build:
    name: Pages Build and Deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4

  apk-build:
    name: Build APK with Custom App Icon
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Image Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Create App Icons from Uploaded JPG
        shell: bash
        run: |
          set -e
          test -f "IMG-20261028-WA3060.jpg"
          mkdir -p app/src/main/res
          cat > /tmp/make_icons.py <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          source = Path("IMG-20261028-WA3060.jpg")
          image = Image.open(source).convert("RGBA")

          width, height = image.size
          side = min(width, height)
          left = (width - side) // 2
          top = (height - side) // 2

          image = image.crop(
              (left, top, left + side, top + side)
          )
          image = image.resize(
              (512, 512), Image.Resampling.LANCZOS
          )

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              folder = Path(
                  f"app/src/main/res/mipmap-{density}"
              )
              folder.mkdir(parents=True, exist_ok=True)

              icon = image.resize(
                  (size, size), Image.Resampling.LANCZOS
              )
              icon.save(folder / "ic_launcher.png")

              round_icon = icon.copy()
              mask = Image.new("L", (size, size), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse(
                  (0, 0, size - 1, size - 1),
                  fill=255
              )
              round_icon.putalpha(mask)
              round_icon.save(
                  folder / "ic_launcher_round.png"
              )

          print("App icons created successfully.")
          PY
          python3 /tmp/make_icons.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android Licenses and Install SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android Project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/dullewalaconnect/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DulleWalaConnect"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.dullewalaconnect.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dullewalaconnect.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '1.2'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#075C36</item>
                  <item name="android:navigationBarColor">#075C36</item>
                  <item name="android:colorAccent">#D4AF37</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="Dulle Wala Connect"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dullewalaconnect/app/MainActivity.java <<'EOF'
          package com.dullewalaconnect.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl(
                      "https://thecobradeveloper.github.io/dulle-wala-connect/"
                  );
              }

              @Override
              public void onBackPressed() {
                  super.onBackPressed();
              }
          }
          EOF

      - name: Download Gradle
        shell: bash
        run: |
          set -e
          curl -fL --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip

      - name: Build APK
        run: ./gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dulle-Wala-Connect-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
